[package]
name = "tabius-desktop"
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
description = "A focused SSH workspace"
license = "GPL-3.0-only"
build = "src/build.rs"

[lib]
name = "tabius_desktop_lib"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }

[dependencies]
tauri = { version = "2.12.5", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
portable-pty = "0.9"
uuid = { version = "1", features = ["v4"] }
base64 = "0.23"
sha2 = "0.11.1"
reqwest = { version = "0.13.5", default-features = false, features = ["json", "rustls", "stream"] }
serde_yaml_ng = "0.10.0"
aes = "0.8"
cbc = "0.1"
pbkdf2 = "0.13"
chrono = "0.4.45"
getrandom = "0.4"
argon2 = { version = "0.5", default-features = false, features = ["alloc", "zeroize"] }
chacha20poly1305 = { version = "0.11", default-features = false, features = ["alloc", "zeroize"] }
hkdf = "0.13"
zeroize = "1"
glob = "0.3"

[target.'cfg(unix)'.dependencies]
nix = { version = "0.31", features = ["process", "signal"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization"] }

[dev-dependencies]
tempfile = "3"

[lints.clippy]
all = "deny"
