name: Build and verify
on:
  workflow_call:
    inputs:
      configuration:
        description: Debug or Release.
        required: true
        type: string
permissions:
  contents: read
jobs:
  build:
    name: ${{ inputs.configuration }} / ${{ matrix.platform }}
    runs-on: ${{ matrix.runner }}
    container: ${{ matrix.container }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-x64
            runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            container: ubuntu:22.04
          - platform: macos-arm64
            runner: macos-26
            target: aarch64-apple-darwin
            container: ""
          - platform: macos-x64
            runner: macos-15-intel
            target: x86_64-apple-darwin
            container: ""
          - platform: windows-x64
            runner: windows-2025
            target: x86_64-pc-windows-msvc
            container: ""
    defaults:
      run:
        shell: bash
    env:
      BUILD_CONFIGURATION: ${{ inputs.configuration }}
      BUILD_TARGET: ${{ matrix.target }}
      CARGO_TERM_COLOR: always
      CARGO_BUILD_JOBS: "2"
      MACOSX_DEPLOYMENT_TARGET: "13.0"
      UV_PYTHON: "3.14"
    steps:
      - name: Bootstrap Linux container
        if: runner.os == 'Linux'
        run: |
          apt-get update
          apt-get install --no-install-recommends -y git tar gzip ca-certificates
      - uses: actions/checkout@v7.0.1
      - uses: ./.github/actions/setup
        with:
          configuration: ${{ inputs.configuration }}
      - name: Select build profile
        run: |
          case "$BUILD_CONFIGURATION" in
            Debug) echo 'BUILD_PROFILE=dev' >> "$GITHUB_ENV" ;;
            Release) echo 'BUILD_PROFILE=release' >> "$GITHUB_ENV" ;;
            *) echo "Unsupported configuration: $BUILD_CONFIGURATION" >&2; exit 1 ;;
          esac
      - name: Check frontend types, lint, and formatting
        run: bun run check
      - name: Check Rust formatting
        run: cargo fmt --all -- --check
      - name: Lint Rust
        run: cargo clippy --locked --target "$BUILD_TARGET" --profile "$BUILD_PROFILE" --all-targets --all-features -- -D warnings
      - name: Test Rust and native PTY
        run: cargo test --locked --target "$BUILD_TARGET" --profile "$BUILD_PROFILE" --all-targets --all-features
      - name: Build application
        run: cargo build --locked --target "$BUILD_TARGET" --profile "$BUILD_PROFILE" --bin tabius-desktop
      - name: Package and verify application
        run: |
          package_options=()
          if [ "$BUILD_CONFIGURATION" = Release ]; then
            package_options+=(--installers)
          fi
          uv run --no-project python scripts/release.py package \
            --configuration "$BUILD_CONFIGURATION" --target "$BUILD_TARGET" \
            --verify "${package_options[@]}"
      - name: Upload application
        uses: actions/upload-artifact@v7.0.2
        with:
          name: tabius-${{ inputs.configuration }}-${{ matrix.platform }}-${{ github.sha }}
          path: artifacts/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
