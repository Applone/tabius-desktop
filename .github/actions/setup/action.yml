name: Set up Tabius build tools
description: Install native dependencies, Rust, Bun, Python, and packaging tools.
inputs:
  configuration:
    description: Debug or Release, used to isolate build caches.
    required: true
runs:
  using: composite
  steps:
    - name: Install Linux dependencies
      if: runner.os == 'Linux'
      shell: bash
      run: |
        apt-get update
        apt-get install --no-install-recommends -y \
          build-essential cmake curl ca-certificates pkg-config libwebkit2gtk-4.1-dev \
          libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libssl-dev \
          libdbus-1-dev openssh-client desktop-file-utils binutils unzip
    - uses: dtolnay/rust-toolchain@master
      with:
        toolchain: "1.99.1"
        components: clippy,rustfmt
    - uses: Swatinem/rust-cache@v2
      with:
        shared-key: ${{ runner.os }}-${{ runner.arch }}-${{ inputs.configuration }}
        save-if: ${{ github.event_name == 'push' && (github.ref == format('refs/heads/{0}', github.event.repository.default_branch) || startsWith(github.ref, 'refs/tags/')) }}
    - uses: oven-sh/setup-bun@v2.2.0
      with:
        bun-version: "1.4.2"
    - uses: astral-sh/setup-uv@v10.3.3
      with:
        python-version: "3.14"
        enable-cache: false
    - name: Install frontend dependencies
      shell: bash
      run: bun install --frozen-lockfile
    - name: Install nFPM
      if: runner.os == 'Linux' && inputs.configuration == 'Release'
      shell: bash
      run: uv run --no-project python scripts/release.py install-tools
    - name: Use Windows OpenSSH
      if: runner.os == 'Windows'
      shell: pwsh
      run: |
        $ssh = "$env:WINDIR\System32\OpenSSH"
        if (-not (Test-Path "$ssh\ssh.exe")) { throw 'Windows OpenSSH Client is required' }
        $ssh | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
